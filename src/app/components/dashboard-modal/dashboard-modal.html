<h2 mat-dialog-title>Create New Dashboard</h2>

<mat-dialog-content>
  <form [formGroup]="dashboardForm" class="dashboard-form">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Dashboard ID</mat-label>
      <input matInput formControlName="id" placeholder="e.g., kitchen" />
      <mat-hint>Max 30 characters</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" placeholder="e.g., Kitchen" />
      <mat-hint>Max 50 characters</mat-hint>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Material Icon</mat-label>
      <input matInput formControlName="icon" placeholder="e.g., home" />
      <mat-icon matSuffix>{{ icon?.value || 'home' }}</mat-icon>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onSubmit()" [disabled]="dashboardForm.invalid">
    Create
  </button>
</mat-dialog-actions>
