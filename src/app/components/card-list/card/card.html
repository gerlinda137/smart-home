<mat-card class="card">
  <mat-card-title class="card__title">{{ card.title }}</mat-card-title>

  <div class="card__items" [class]="layoutClass">
    @for (item of card.items; track item.label) {
    @switch (item.type) {
    @case ('sensor') {
    <app-sensor [sensor]="item"></app-sensor>
    }
    @default {
    <p>Unknown item type: {{ item.type }}</p>
    }
    }
    }
  </div>






</mat-card>
