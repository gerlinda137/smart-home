<footer class="sidebar-footer"> @if (userProfile$ | async; as user) {
  <div class="rs-badge" aria-label="RS School">
    <span class="rs-badge__text">{{ user.initials }}</span>
  </div>

  <div class="footer-text">

    <span class="footer-text__main">{{ user.fullName }}</span>
    <span class="footer-text__accent"></span>
    <button mat-button (click)="logout()" class="logout-btn">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </div>
  }
  @else {
  <div class="rs-badge" aria-label="RS School">
    <span class="rs-badge__text">RS</span>
  </div>

  <div class="footer-text">
    <span class="footer-text__main">RSSchool.</span>
    <span class="footer-text__accent">Angular</span>
  </div>
  }
</footer>
