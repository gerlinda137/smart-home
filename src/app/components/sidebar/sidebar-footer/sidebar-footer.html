<footer class="sidebar-footer">
  <div class="rs-badge" aria-label="RS School">
    <span class="rs-badge__text">RS</span>
  </div>

  <div class="footer-text">
    @if (userProfile$ | async; as user) {
    <span class="footer-text__main">{{ user.fullName }}</span>
    <span class="footer-text__accent">{{ user.initials }}</span>
    } @else {
    <span class="footer-text__main">RSSchool.</span>
    <span class="footer-text__accent">Angular</span>
    }
  </div>
</footer>
