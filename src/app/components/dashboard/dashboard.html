<div class="tabs-wrapper">
  <div class="tabs-header">
    <mat-tab-group mat-stretch-tabs="false" mat-align-tabs="start" [selectedIndex]="selectedIndex"
      (selectedTabChange)="onTabChange($event.index)">
      @for (tab of dashboard().tabs; track tab.id) {
      <mat-tab>
        <ng-template mat-tab-label>
          @if(editingTabId() !== tab.id) {
          <span class="tab-label">{{ tab.title }}</span>
          @if (isEditMode$()()) {
          <button mat-icon-button class="edit-tab-btn" (click)="startEditTab(tab.id); $event.stopPropagation()">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button class="remove-tab-btn" (click)="removeTab(tab.id); $event.stopPropagation()">
            <mat-icon>close</mat-icon>
          </button>
          }
          } @else {
          <div class="tab-edit-form">
            <input #editInput class="tab-edit-input" [value]="tab.title"
              (keyup.enter)="saveTabTitle(tab.id, editInput.value)" />
            <button mat-icon-button color="primary"
              (click)="saveTabTitle(tab.id, editInput.value); $event.stopPropagation()">
              <mat-icon>check</mat-icon>
            </button>
            <button mat-icon-button (click)="cancelEditTab(); $event.stopPropagation()">
              <mat-icon>close</mat-icon>
            </button>
          </div>
          }

        </ng-template>
        <app-card-list [cards]="tab.cards"></app-card-list>
      </mat-tab>
      }
    </mat-tab-group>
  </div>
  @if (isEditMode$()()) {
  @if (!isAddingTab()) {
  <button mat-raised-button color="primary" class="add-tab-btn" (click)="showAddTabForm()">
    <mat-icon>add</mat-icon>Add new tab

  </button>} @else {
  <div class="add-tab-form">

    <input #tabInput matInput type="text" placeholder="Tab name" />

    <button mat-icon-button color="primary" (click)="addTab(tabInput.value); tabInput.value = ''">
      <mat-icon>check</mat-icon>
    </button>

    <button mat-icon-button (click)="cancelAddTab()">
      <mat-icon>close</mat-icon>
    </button>
  </div>
  }
  }
</div>
